# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://akshaymiterani.github.io"

# SEO / link previews (used by jekyll-seo-tag)
title: "Akshay Miterani"
description: >-
  Akshay Miterani is a Senior Software Engineer at Uber working on large-scale
  distributed systems, previously at Google (Privacy Sandbox Topics API, Google TV)
  and Amazon. Codeforces Candidate Master.
lang: en_US
author:
  name: "Akshay Miterani"
social:
  name: "Akshay Miterani"
  links:
    - https://github.com/akshaymiterani
    - https://www.linkedin.com/in/akshay-miterani-108827105
    - https://codeforces.com/profile/akshay_miterani
    - https://www.quora.com/profile/Akshay-Miterani

# Build settings
markdown: kramdown
plugins:
  - jekyll-email-protect
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AkshayMiteraniCV_2024.pdf
  - README.md
  - LICENSE
  # Unused template pages/assets (kept in the repo, not published)
  - index_layout2.html
  - blog.html # re-enable once there are posts in _posts/
  - publications.html
  - showcase.html
  - assets/js/bubble_visual_hash.js
  - assets/js/semantic_scholar_citation_count.js
  - assets/css/images/
  - assets/images/covers/
  - assets/images/badges/
  - assets/images/etc/
  - assets/images/empty_300x200.png

# timezone: Asia/Shanghai

collections:
  - posts

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/photos/portrait.jpg
